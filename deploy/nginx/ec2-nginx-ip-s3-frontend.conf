# Nginx trên EC2 (IP): API + SockJS + static FE trên cùng máy.
# Dùng khi: browser gọi http://<IP>/api và http://<IP>/chat từ origin S3.
# Đặt vào /etc/nginx/conf.d/ (hoặc include từ nginx.conf), rồi: sudo nginx -t && sudo systemctl reload nginx
#
# Elastic IP (ổn định): 52.76.233.218 — cập nhật server_name nếu đổi IP.
# Sửa: server_name, root frontend, alias uploads, upstream port 8080 nếu khác.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name 52.76.233.218;

    client_max_body_size 20m;

    # --- Static FE trên EC2 (nếu chỉ dùng S3 cho FE, có thể bỏ block location / và chỉ giữ /api + /chat + /uploads) ---
    location / {
        root /home/ec2-user/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- SPA: chỉ đúng path /chat (có ?query vẫn là /chat) — không proxy sang Spring ---
    location = /chat {
        root /home/ec2-user/frontend;
        try_files /index.html =404;
    }

    # --- SockJS + STOMP: /ws/info, /ws/.../xhr, websocket... — Spring Boot ---
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Không add_header CORS ở đây — Spring (CorsConfig + SockJS) đã gắn; Nginx thêm sẽ trùng header và browser chặn.
    }

    # --- REST API (Spring giữ prefix /api) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # CORS: ưu tiên để Spring + CorsConfig xử lý; chỉ thêm Nginx nếu bạn chắc backend không trùng.
    }

    # --- Health (tuỳ chọn) ---
    location /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # --- Ảnh upload từ backend ---
    location /uploads/ {
        alias /home/ec2-user/uploads/;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
