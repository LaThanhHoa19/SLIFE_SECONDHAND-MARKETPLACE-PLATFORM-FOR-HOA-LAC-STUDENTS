# Nginx trong container trên EC2 khi FE trên S3, chỉ proxy API + SockJS tới Spring.
# KHÔNG dùng upstream "backend"/"frontend" (chỉ có trong docker-compose).
#
# Chạy container kèm:
#   --add-host=host.docker.internal:host-gateway
# để host.docker.internal trỏ tới máy host (port 8080 = container slife-be đã publish).
#
# Hoặc cùng network với backend: đổi upstream thành "slife-be:8080" (tên container).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream spring_backend {
    server host.docker.internal:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /actuator/health {
        proxy_pass http://spring_backend/actuator/health;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://spring_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # FE trên S3 — không phục vụ SPA tại đây
    location / {
        return 404;
    }
}
