# Docker DNS (127.0.0.11) + biến trong proxy_pass để không cache IP container —
# tránh 502 sau khi `docker compose up --build backend` (backend đổi IP, nginx vẫn trỏ IP cũ).

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # SPA route /chat: phải đi frontend, nếu không sẽ rơi vào SockJS welcome page khi reload.
    location = /chat {
        set $vite_host frontend;
        proxy_pass http://$vite_host:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600;
    }

    # WebSocket endpoint cho SockJS / STOMP chat
    # (vd: /chat/info, /chat/{server}/{session}/websocket)
    location /chat {
        set $spring_host backend;
        proxy_pass http://$spring_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    location /api/ {
        set $spring_host backend;
        proxy_pass http://$spring_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        charset utf-8;
    }

    location /uploads/ {
        set $spring_host backend;
        proxy_pass http://$spring_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /actuator/health {
        set $spring_host backend;
        proxy_pass http://$spring_host:8080/actuator/health;
        proxy_set_header Host $host;
    }

    location / {
        set $vite_host frontend;
        proxy_pass http://$vite_host:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600;
    }

    location /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
