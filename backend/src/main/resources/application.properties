spring.application.name=slife_db
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# UTF-8 cho request/response JSON (tiếng Việt, tránh lỗi đọc body)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Upload limits (raise from default 1MB for listing images)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB

# Upload directory (override with ENV APP_UPLOAD_DIR) — dùng khi app.storage.mode=local
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# local = ghi đĩa (mặc định); s3 = AWS S3 (AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY hoặc IAM role EC2)
app.storage.mode=${APP_STORAGE_MODE:local}
app.storage.s3.bucket=${AWS_S3_BUCKET:}
app.storage.s3.region=${AWS_REGION:ap-southeast-1}
app.storage.s3.key-prefix=${AWS_S3_KEY_PREFIX:media}
# Tuỳ chọn: CDN / website endpoint, không dấu / cuối
app.storage.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false
# Ignore migrations that exist in DB history but no longer in source.
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.locations=classpath:db/migration
# Fail fast on bad migration filenames (pattern V1__description.sql)
spring.flyway.validate-migration-naming=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

jwt.secret=${JWT_SECRET:replace-secret}
jwt.expiration=${JWT_EXPIRATION:3600000}
google.clientId=${GOOGLE_CLIENT_ID:318344558779-vee2ail43gcadoi97fo2q9122jm9qe7k.apps.googleusercontent.com}
google.clientSecret=${GOOGLE_CLIENT_SECRET:}

# SMTP (welcome + offer). Bắt buộc chỉnh SPRING_MAIL_* / APP_MAIL_FROM cho môi trường thật (Gmail: smtp.gmail.com, port 587, app password).
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:true}
# false = không gửi mail (welcome cũng không đánh dấu đã gửi).
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:noreply@slife.local}
# smtp = JavaMailSender trực tiếp | http = POST tới Firebase Cloud Function (firebase/functions)
app.mail.transport=${APP_MAIL_TRANSPORT:smtp}
app.mail.http.url=${APP_MAIL_HTTP_URL:}
app.mail.http.secret=${APP_MAIL_HTTP_SECRET:}
# Nếu set (dev/test): mọi email gửi ra đều tới địa chỉ này (users.email trong DB vẫn khác nhau).
app.mail.force-to=${APP_MAIL_FORCE_TO:}

app.scheduler.pickup-reminder-cron=0 */5 * * * *
# Mỗi giờ (phút 30): nhắc buyer xác nhận deal trước auto-finalize
app.scheduler.auto-finalize-reminder-cron=0 30 * * * *
# Hàng giờ: ACTIVE quá expiration_date → HIDDEN theo batch (đồng bộ DB)
app.scheduler.expire-listing-cron=0 0 * * * *
app.scheduler.expire-listing-batch-size=100

# ── Redis ──────────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000
# ElastiCache Serverless bắt buộc TLS — bật khi deploy prod (REDIS_SSL=true)
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# Vietmap: set keys via ENV only in production
vietmap.servicesKey=${VIETMAP_SERVICES_KEY:}
vietmap.tileKey=${VIETMAP_TILE_KEY:}
vietmap.baseUrl=${VIETMAP_BASE_URL:https://maps.vietmap.vn/api}

jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:43200000}
# Idle timeout cho refresh token (mặc định 4 giờ, khớp frontend IDLE_TIMEOUT_MS)
app.auth.idle-timeout-ms=${AUTH_IDLE_TIMEOUT_MS:14400000}
app.auth.refresh-cookie-secure=${AUTH_REFRESH_COOKIE_SECURE:false}
auth.dev-login-enabled=${AUTH_DEV_LOGIN_ENABLED:false}

# Firebase phone verification
firebase.web-api-key=${FIREBASE_WEB_API_KEY:AIzaSyDMQRxyUXZkj5_UF2s24hRQK6UJWnt031I}

# ── Chat message encryption (AES-256-GCM) ─────────────────────────────────────
# Base64-encoded 32-byte key. Nếu rỗng → lưu plaintext (tương thích ngược).
app.chat.encryption-key=${CHAT_ENCRYPTION_KEY:}


