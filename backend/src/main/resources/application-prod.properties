spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/slife_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# CORS: thêm domain (CloudFront, HTTPS, …) — cách nhau bởi dấu phẩy. Rỗng = chỉ dùng danh sách mặc định trong CorsConfig.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}

logging.level.com.slife.marketplace=INFO
server.forward-headers-strategy=framework

# Bỏ health check SMTP (dùng HTTP relay, không cần SMTP)
management.health.mail.enabled=false
